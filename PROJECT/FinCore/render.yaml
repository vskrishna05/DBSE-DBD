services:
  - type: web
    name: fincore-saas
    runtime: python
    plan: free
    rootDir: PROJECT/FinCore
    buildCommand: "npm --prefix frontend install && npm --prefix frontend run build && pip install -r backend/requirements.txt"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        value: "sqlite:///fincore.db"
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
